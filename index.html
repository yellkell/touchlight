<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TOUCHLIGHT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOUCHLIGHT  –  style.css
   ============================================================ */

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0; padding: 0;
}

:root {
  --hdr: 62px;
  --bg:  #07070f;
  --surface: rgba(255,255,255,0.06);
  --border:  rgba(255,255,255,0.11);
  --text:    #ffffff;
  --accent:  #b06fff;
  --accent2: #00d4ff;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}

/* ---- Layout ---- */
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100svh;
}

/* ---- Header ---- */
#header {
  height: var(--hdr);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  background: rgba(7,7,15,0.85);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  gap: 10px;
  z-index: 20;
}

#logo {
  font-family: 'Orbitron', 'Impact', sans-serif;
  font-weight: 900;
  font-size: clamp(1rem, 4vw, 1.55rem);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  background: linear-gradient(90deg, #fff 0%, var(--accent2) 45%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  white-space: nowrap;
}

#logo span {
  background: linear-gradient(90deg, var(--accent2) 0%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

#controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

/* ---- Buttons ---- */
.btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 16px;
  border-radius: 24px;
  font-family: 'Orbitron', sans-serif;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  cursor: pointer;
  transition: background 0.18s, border-color 0.18s, box-shadow 0.18s;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}
.btn:hover { background: rgba(255,255,255,0.13); }
.btn:active { transform: scale(0.96); }

.btn.active {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 18px rgba(176,111,255,0.55);
}

.btn.accent {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-color: transparent;
  box-shadow: 0 0 18px rgba(176,111,255,0.45);
}

select {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 12px;
  border-radius: 24px;
  font-size: 0.72rem;
  font-weight: 600;
  cursor: pointer;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  max-width: 170px;
}
select option { background: #141428; color: #fff; }

.hidden { display: none !important; }

/* ---- Main + Grid ---- */
#main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  min-height: 0;
}

#grid-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
}

#grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: #000;
  /* size: fit both viewport dimensions */
  width:  min(calc(100vh  - var(--hdr) - 44px), calc(100vw - 20px));
  width:  min(calc(100svh - var(--hdr) - 44px), calc(100vw - 20px));
  aspect-ratio: 1;
}

/* ---- Tile (square cell) ---- */
.tile {
  background: #000;
  aspect-ratio: 1;
  position: relative;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}

/* ---- Octagon (clipped inner shape) ---- */
.octagon {
  position: absolute;
  inset: 6.5%;
  clip-path: polygon(
    29.3% 0%,  70.7% 0%,
    100%  29.3%, 100%  70.7%,
    70.7% 100%, 29.3% 100%,
    0%    70.7%, 0%    29.3%
  );
  background: var(--color);
  will-change: transform, filter;
}

/* Note label inside octagon */
.note-label {
  position: absolute;
  bottom: 19%;
  left: 50%;
  transform: translateX(-50%);
  font-size: clamp(0.42rem, 1.6vw, 0.68rem);
  font-weight: 700;
  color: rgba(0,0,0,0.38);
  pointer-events: none;
  white-space: nowrap;
  letter-spacing: 0.01em;
  font-family: 'Orbitron', monospace;
}

/* ============================================================
   ANIMATIONS
   ============================================================ */

/* -- Tap flash -- */
@keyframes tap-flash {
  0%   { filter: brightness(1)   saturate(1);   transform: scale(1); }
  10%  { filter: brightness(5.5) saturate(0.4); transform: scale(1.08); }
  100% { filter: brightness(1)   saturate(1);   transform: scale(1); }
}
.octagon.flash {
  animation: tap-flash 0.38s cubic-bezier(.22,.61,.36,1) forwards;
}

/* -- Shockwave ripple on every tap -- */
.ripple-wave {
  position: absolute;
  inset: 6.5%;
  clip-path: polygon(29.3% 0%, 70.7% 0%, 100% 29.3%, 100% 70.7%, 70.7% 100%, 29.3% 100%, 0% 70.7%, 0% 29.3%);
  background: rgba(255,255,255,0.55);
  pointer-events: none;
  animation: ripple-wave-out 0.55s ease-out forwards;
  z-index: 5;
}
@keyframes ripple-wave-out {
  0%   { transform: scale(1);   opacity: 0.75; }
  100% { transform: scale(1.7); opacity: 0; }
}

/* -- Neighbor glow (correct tap radiates outward) -- */
@keyframes neighbor-glow {
  0%   { filter: brightness(1); }
  35%  { filter: brightness(3) drop-shadow(0 0 12px var(--color)); }
  100% { filter: brightness(1); }
}
.octagon.neighbor-glow {
  animation: neighbor-glow 0.55s ease-out forwards;
}

/* -- Guided: next note pulsing (more dramatic, unmistakable) -- */
@keyframes guided-pulse {
  0%, 100% {
    filter: brightness(1.2) drop-shadow(0 0 10px var(--color));
    transform: scale(1);
  }
  50% {
    filter: brightness(4.5) saturate(1.4)
            drop-shadow(0 0 30px var(--color))
            drop-shadow(0 0 60px white);
    transform: scale(1.13);
  }
}
.octagon.guided-active {
  animation: guided-pulse 0.65s ease-in-out infinite;
}

/* Outer ring on guided hint tile */
.tile.guided-hint::after {
  content: '';
  position: absolute;
  inset: 2%;
  clip-path: polygon(29.3% 0%, 70.7% 0%, 100% 29.3%, 100% 70.7%, 70.7% 100%, 29.3% 100%, 0% 70.7%, 0% 29.3%);
  background: rgba(255,255,255,0.18);
  pointer-events: none;
  animation: hint-ring 0.65s ease-in-out infinite;
  z-index: 1;
}
@keyframes hint-ring {
  0%, 100% { transform: scale(1);    opacity: 0.4; }
  50%       { transform: scale(1.18); opacity: 0.9; }
}

/* -- Correct tap -- */
@keyframes correct-tap {
  0%   { filter: brightness(1)   saturate(1); }
  20%  { filter: brightness(6)   saturate(2); }
  100% { filter: brightness(1)   saturate(1); }
}
.octagon.correct {
  animation: correct-tap 0.46s ease-out forwards;
}

/* -- Wrong tap: shake + red wash -- */
@keyframes wrong-tap {
  0%   { transform: translateX(0)    scale(1);    filter: brightness(1); }
  18%  { transform: translateX(-6px) scale(0.95); filter: brightness(0.3) sepia(1) saturate(4) hue-rotate(-25deg); }
  42%  { transform: translateX( 6px) scale(0.95); filter: brightness(0.3) sepia(1) saturate(4) hue-rotate(-25deg); }
  62%  { transform: translateX(-4px);              filter: brightness(0.65); }
  80%  { transform: translateX( 4px);              filter: brightness(0.65); }
  100% { transform: translateX(0)    scale(1);    filter: brightness(1); }
}
.octagon.wrong {
  animation: wrong-tap 0.52s ease-out forwards;
}

/* -- Celebration wave -- */
@keyframes celebrate {
  0%   { filter: brightness(1)   hue-rotate(0deg);   transform: scale(1); }
  28%  { filter: brightness(6)   hue-rotate(120deg); transform: scale(1.14); }
  65%  { filter: brightness(2.5) hue-rotate(240deg); transform: scale(1.07); }
  100% { filter: brightness(1)   hue-rotate(360deg); transform: scale(1); }
}
.octagon.celebrate {
  animation: celebrate 0.72s ease-out forwards;
}

/* -- Idle ambient twinkle (free-play only, intentionally subtle) -- */
@keyframes idle-twinkle {
  0%, 100% { filter: brightness(1); }
  50%       { filter: brightness(1.55); }
}
.octagon.idle-twinkle {
  animation: idle-twinkle 0.7s ease-in-out forwards;
}

/* ============================================================
   PROGRESS BAR (guided mode)
   ============================================================ */
#progress-bar {
  height: 4px;
  background: rgba(255,255,255,0.08);
  flex-shrink: 0;
}
#progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  width: 0%;
  transition: width 0.25s ease-out;
  box-shadow: 0 0 8px var(--accent2);
}

/* ============================================================
   MESSAGE OVERLAY
   ============================================================ */
#overlay {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  z-index: 50;
  opacity: 0;
  transition: opacity 0.28s;
}
#overlay.visible { opacity: 1; }

#overlay-text {
  font-family: 'Orbitron', 'Impact', sans-serif;
  font-size: clamp(1.5rem, 5.5vw, 3rem);
  font-weight: 900;
  letter-spacing: 0.1em;
  text-align: center;
  color: #fff;
  text-shadow: 0 0 40px rgba(255,255,255,0.7), 0 0 80px rgba(176,111,255,0.5);
  background: rgba(7,7,15,0.78);
  padding: 18px 44px;
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,0.18);
  backdrop-filter: blur(16px);
}

/* ---- Scrollbar hide ---- */
::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="app">
  <header id="header">
    <div id="logo">TOUCH<span>LIGHT</span></div>
    <div id="controls">
      <button id="mode-btn" class="btn">GUIDED</button>
      <select id="song-select" class="hidden"><option value="twinkle">Twinkle Twinkle</option></select>
      <button id="start-btn" class="btn accent hidden">▶ START</button>
    </div>
  </header>
  <main id="main"><div id="grid-wrap"><div id="grid"></div></div></main>
  <div id="progress-bar" class="hidden"><div id="progress-fill"></div></div>
  <div id="overlay"><div id="overlay-text"></div></div>
</div>
<script>
// TOUCHLIGHT  –  audio.js
// Marimba-like synthesiser using Web Audio API

var _ctx    = null;
var _reverb = null;
var _dryGain = null;
var _wetGain = null;

function _boot() {
  if (_ctx) return;
  _ctx = new (window.AudioContext || window.webkitAudioContext)();

  /* ---- Synthetic room reverb ---- */
  _reverb = _ctx.createConvolver();
  var sr  = _ctx.sampleRate;
  var len = Math.floor(sr * 1.4);
  var buf = _ctx.createBuffer(2, len, sr);
  for (var ch = 0; ch < 2; ch++) {
    var d = buf.getChannelData(ch);
    for (var i = 0; i < len; i++) {
      // decaying random noise impulse response
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.8);
    }
  }
  _reverb.buffer = buf;

  /* ---- Master dry / wet ---- */
  _dryGain = _ctx.createGain();
  _wetGain = _ctx.createGain();
  _dryGain.gain.value = 0.80;
  _wetGain.gain.value = 0.20;

  _dryGain.connect(_ctx.destination);
  _wetGain.connect(_reverb);
  _reverb.connect(_ctx.destination);
}

function playNote(frequency, duration) {
  duration = duration || 0.85;
  _boot();
  if (_ctx.state === 'suspended') _ctx.resume();

  var ctx = _ctx;
  var now = ctx.currentTime;
  var atk = 0.004; // 4ms attack — percussive

  /* ---- Oscillators ----
     Real marimba bars produce inharmonic overtones.
     We model the 3 main partials with their approximate
     frequency ratios: 1 : 2.756 : 5.404               */
  var o1 = ctx.createOscillator(); o1.type = 'sine'; o1.frequency.value = frequency;
  var o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = frequency * 2.756;
  var o3 = ctx.createOscillator(); o3.type = 'sine'; o3.frequency.value = frequency * 5.404;

  var g1 = ctx.createGain();
  var g2 = ctx.createGain();
  var g3 = ctx.createGain();
  var master = ctx.createGain();
  master.gain.value = 0.82;

  /* Envelopes — fundamental decays longest */
  var d1 = duration * 0.92;
  var d2 = duration * 0.32;
  var d3 = duration * 0.14;

  _env(g1.gain, now, atk, d1, 0.62);
  _env(g2.gain, now, atk, d2, 0.20);
  _env(g3.gain, now, atk, d3, 0.06);

  o1.connect(g1); g1.connect(master);
  o2.connect(g2); g2.connect(master);
  o3.connect(g3); g3.connect(master);
  master.connect(_dryGain);
  master.connect(_wetGain);

  var stop = now + duration + 0.12;
  o1.start(now); o1.stop(stop);
  o2.start(now); o2.stop(stop);
  o3.start(now); o3.stop(stop);
}

function _env(param, now, attack, decay, peak) {
  param.setValueAtTime(0, now);
  param.linearRampToValueAtTime(peak, now + attack);
  param.exponentialRampToValueAtTime(0.0001, now + attack + decay);
}

function playChord(frequencies, duration) {
  frequencies.forEach(function(f) { playNote(f, duration); });
}
// TOUCHLIGHT  –  songs.js
// Chromatic C4 → C6 (25 notes) note table + song definitions

var NOTE_INDEX = {};
NOTES.forEach(function(n, i) { NOTE_INDEX[n.name] = i; });

var SONGS = {
  twinkle: {

    notes: [
      'C4','C4','G4','G4','A4','A4','G4',

// TOUCHLIGHT  –  app.js
// Main application: grid, touch handling, free-play + guided mode

/* ============================================================
   COLOR PALETTE  (25 vibrant hues, one per chromatic note)
   ============================================================ */
var COLORS = [
  '#FF4E6A', // C4   coral-red
  '#FF7A45', // C#4  burnt orange
  '#FFC837', // D4   amber
  '#F9F032', // D#4  lemon
  '#A8FF48', // E4   lime
  '#26DE81', // F4   emerald
  '#11EFC8', // F#4  aquamarine
  '#00D4FF', // G4   cyan
  '#00AEFF', // G#4  sky
  '#4480FF', // A4   cobalt
  '#6B5BFF', // A#4  indigo
  '#9B40FF', // B4   violet
  '#D040FB', // C5   magenta
  '#FF3DB8', // C#5  hot pink
  '#FF4D8F', // D5   rose
  '#FF5E78', // D#5  salmon-pink
  '#FF6B35', // E5   tangerine
  '#FFAA00', // F5   gold
  '#FFE033', // F#5  sunflower
  '#B4FF47', // G5   yellow-green
  '#3BFFA8', // G#5  mint
  '#00FFEE', // A5   turquoise
  '#40BFFF', // A#5  powder blue
  '#A066FF', // B5   lavender-violet
  '#FF66CC', // C6   orchid-pink
];

/* ============================================================
   DOM
   ============================================================ */
var gridEl      = document.getElementById('grid');
var modeBtnEl   = document.getElementById('mode-btn');
var songSelectEl= document.getElementById('song-select');
var startBtnEl  = document.getElementById('start-btn');
var progressBar = document.getElementById('progress-bar');
var progressFill= document.getElementById('progress-fill');
var overlayEl   = document.getElementById('overlay');
var overlayText = document.getElementById('overlay-text');

/* ============================================================
   STATE
   ============================================================ */
var mode    = 'free';  // 'free' | 'guided'
var guided  = null;    // { notes, step, total } or null

/* ============================================================
   BUILD GRID
   ============================================================ */
var tiles = NOTES.map(function(note, i) {
  var tile = document.createElement('div');
  tile.className = 'tile';
  tile.setAttribute('role', 'button');
  tile.setAttribute('tabindex', '0');
  tile.setAttribute('aria-label', note.name);

  var oct = document.createElement('div');
  oct.className = 'octagon';
  oct.style.setProperty('--color', COLORS[i]);

  var lbl = document.createElement('span');
  lbl.className = 'note-label';
  lbl.textContent = note.label;

  oct.appendChild(lbl);
  tile.appendChild(oct);
  gridEl.appendChild(tile);

  tile.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    onTap(i);
  });

  tile.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onTap(i); }
  });

  return { tile: tile, oct: oct, note: note };
});

/* ============================================================
   MODE TOGGLE  — one tap starts Twinkle Twinkle silently
   ============================================================ */
modeBtnEl.addEventListener('click', function() {
  if (mode === 'free') {
    mode = 'guided';
    modeBtnEl.textContent = 'FREE PLAY';
    modeBtnEl.classList.add('active');
    stopGuided();
    guided = { notes: SONGS.twinkle.notes.slice(), step: 0, total: SONGS.twinkle.notes.length };
    progressBar.classList.remove('hidden');
    setProgress(0);
    setTimeout(function() { if (guided) highlightStep(); }, 400);
  } else {
    mode = 'free';
    modeBtnEl.textContent = 'GUIDED';
    modeBtnEl.classList.remove('active');
    progressBar.classList.add('hidden');
    stopGuided();
  }
});


/* ============================================================
   TAP HANDLER
   ============================================================ */
function onTap(idx) {
  var t = tiles[idx];
  playNote(t.note.freq);
  triggerFlash(t.oct);
  spawnRipple(t.tile);

  if (mode === 'guided' && guided) {
    var expected = guided.notes[guided.step];
    var expIdx   = NOTE_INDEX[expected];

    if (idx === expIdx) {
      // Correct note!
      t.tile.classList.remove('guided-hint');
      t.oct.classList.remove('guided-active');
      addAnim(t.oct, 'correct', 480);

      guided.step++;
      setProgress(guided.step / guided.total);

      if (guided.step >= guided.notes.length) {
        var g = guided;
        guided = null;
        setTimeout(function() { celebrate(g); }, 280);
      } else {
        setTimeout(function() { if (guided) highlightStep(); }, 320);
      }
    } else {
      // Wrong note
      addAnim(t.oct, 'wrong', 560);
    }
  }
}

function spawnRipple(tile) {
  var wave = document.createElement('div');
  wave.className = 'ripple-wave';
  tile.appendChild(wave);
  setTimeout(function() { if (wave.parentNode) wave.parentNode.removeChild(wave); }, 580);
}

function getNeighbours(idx) {
  var row = Math.floor(idx / 5), col = idx % 5, result = [];
  [[-1,0],[1,0],[0,-1],[0,1]].forEach(function(d) {
    var r = row + d[0], c = col + d[1];
    if (r >= 0 && r < 5 && c >= 0 && c < 5) result.push(r * 5 + c);
  });
  return result;
}

/* ============================================================
   GUIDED HELPERS
   ============================================================ */
function highlightStep() {
  if (!guided) return;
  tiles.forEach(function(t) {
    t.oct.classList.remove('guided-active');
    t.tile.classList.remove('guided-hint');
  });
  var noteName = guided.notes[guided.step];
  var idx = NOTE_INDEX[noteName];
  if (idx !== undefined) {
    tiles[idx].oct.classList.add('guided-active');
    tiles[idx].tile.classList.add('guided-hint');
  }
}

function stopGuided() {
  guided = null;
  tiles.forEach(function(t) {
    t.oct.classList.remove('guided-active', 'correct', 'wrong');
    t.tile.classList.remove('guided-hint');
  });
}

function setProgress(ratio) {
  progressFill.style.width = Math.min(ratio * 100, 100) + '%';
}

/* ============================================================
   CELEBRATION
   ============================================================ */
function celebrate(finishedGuided) {
  tiles.forEach(function(t) { t.oct.classList.remove('guided-active'); });
  progressBar.classList.add('hidden');

  showMsg('🎉 BRAVO! 🎉', 3500);

  /* Cascade wave across all tiles */
  tiles.forEach(function(t, i) {
    setTimeout(function() {
      addAnim(t.oct, 'celebrate', 780);
    }, i * 52);
  });

  /* Play C-major arpeggio fanfare */
  var fanfare = [0, 4, 7, 12, 7, 4, 12, 16]; // C E G C E G C E
  fanfare.forEach(function(noteIdx, i) {
    setTimeout(function() {
      if (noteIdx < tiles.length) playNote(tiles[noteIdx].note.freq, 0.7);
    }, i * 130);
  });
}

/* ============================================================
   ANIMATION UTILITIES
   ============================================================ */
function triggerFlash(oct) {
  oct.classList.remove('flash', 'guided-active');
  void oct.offsetWidth; // force reflow to restart animation
  oct.classList.add('flash');
  setTimeout(function() { oct.classList.remove('flash'); }, 400);
}

function addAnim(el, cls, duration) {
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(function() { el.classList.remove(cls); }, duration);
}

/* ============================================================
   MESSAGE OVERLAY
   ============================================================ */
var _msgTimer = null;

function showMsg(text, duration) {
  overlayText.textContent = '';
  // Support newline in message
  text.split('\n').forEach(function(line, i) {
    if (i > 0) overlayText.appendChild(document.createElement('br'));
    overlayText.appendChild(document.createTextNode(line));
  });
  overlayEl.classList.add('visible');
  clearTimeout(_msgTimer);
  _msgTimer = setTimeout(function() {
    overlayEl.classList.remove('visible');
  }, duration || 2000);
}

/* ============================================================
   IDLE AMBIENT TWINKLE  (free-play only)
   ============================================================ */
function idleTick() {
  if (mode === 'free') {
    var idx = Math.floor(Math.random() * tiles.length);
    var t   = tiles[idx];
    var oct = t.oct;
    if (!oct.classList.contains('flash') &&
        !oct.classList.contains('guided-active') &&
        !oct.classList.contains('celebrate')) {
      addAnim(oct, 'idle-twinkle', 720);
    }
  }
  setTimeout(idleTick, 400 + Math.random() * 900);
}

setTimeout(idleTick, 1500);

/* ============================================================
   BACKGROUND STAR PARTICLES
   ============================================================ */
(function spawnStars() {
  var container = document.getElementById('app');
  for (var i = 0; i < 60; i++) {
    (function(idx) {
      var star = document.createElement('div');
      star.style.cssText = [
        'position:fixed',
        'pointer-events:none',
        'z-index:0',
        'border-radius:50%',
        'background:#fff',
        'opacity:' + (0.04 + Math.random() * 0.12),
        'width:'  + (1 + Math.random() * 2.5) + 'px',
        'height:' + (1 + Math.random() * 2.5) + 'px',
        'top:'    + Math.random() * 100 + 'vh',
        'left:'   + Math.random() * 100 + 'vw',
      ].join(';');
      document.body.appendChild(star);
    })(i);
  }
})();
</script></body></html>
